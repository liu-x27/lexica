# 注意：代理不能在这里配。
#
# Gradle 属性的优先级是 命令行 -D > 用户级 ~/.gradle/gradle.properties > 项目级（本文件）。
# 用户全局那份写死了 127.0.0.1:7897，而本机实际监听的是 7890，
# 在这里写 systemProp.https.proxyPort 会被它直接盖掉，看着配了其实没生效，
# 表现是各种 "plugin not found"，像是仓库配错了。
# 代理由 build.bat 用 -D 参数传，那是唯一压得住用户级配置的层级。

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
